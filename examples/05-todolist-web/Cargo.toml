[package]
name = "todolist-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "05-todolist-web — the web host surface (phase 1 of the batch): the example-local `web` pkg (web.d.rut, ten crossings) bound over web_sys on wasm32 and over a fake-DOM twin on host, one on_event re-entry point, tim_after's turn-based queue"

[lib]
# cdylib for the page; rlib so the twin gate (tests/) links the host half
crate-type = ["cdylib", "rlib"]

[dependencies]
rut-core = { path = "../../crates/rut-core" }
rut-parser = { path = "../../crates/rut-parser" }
rut-driver = { path = "../../crates/rut-driver" }
rut-vm = { path = "../../crates/rut-vm" }

# The workspace's FIRST wasm-bindgen-family dependency — example-local
# and target-gated so host builds never see it (survey §3). The feature
# list is 1:1 with the WebIDL types the 11 crossings touch; event types
# join with the phase-2 app, never with the host surface.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlInputElement",
    "Node",
    "EventTarget",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
