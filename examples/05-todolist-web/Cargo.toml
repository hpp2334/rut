[package]
name = "todolist-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "05-todolist-web — the todolist APP: the page program (the rut/ project: the app package over the todos server, the t1 widget framework and the component vocabulary, all manifest-mounted) on the phase-1 `web` pkg — ten crossings, one on_event entry that hands the app its container back, tim_after-simulated latency, the fake-DOM twin as the gate"

[lib]
# cdylib for the page; rlib so the twin gate (tests/) links the host half
crate-type = ["cdylib", "rlib"]

[dependencies]
rut-core = { path = "../../crates/rut-core" }
rut-parser = { path = "../../crates/rut-parser" }
rut-driver = { path = "../../crates/rut-driver" }
rut-vm = { path = "../../crates/rut-vm" }
# nmap_host's bodies — the app's listener table rides the val-column
# row `HashMap<str, i64>` (nmapset), so the page boot binds the native
# key table next to the web crossings
rut-std = { path = "../../crates/rut-std" }

# The workspace's FIRST wasm-bindgen-family dependency — example-local
# and target-gated so host builds never see it (survey §3). The feature
# list is 1:1 with the WebIDL types the 11 crossings touch; event types
# join with the phase-2 app, never with the host surface.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlInputElement",
    "Node",
    "EventTarget",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
