{
  "_comment": "ui/ — the UI-FRAMEWORK package (the two-package law): the atom store\nmachinery + the t1 widget framework + the component vocabulary. ONE\ndirectory, ONE module, SEVERAL files (the multi-lib\nentry): `entry.libs` names the section files, the base splices first,\nthe array IS the order. See ui.rut's header for the store's surface\nlaw and the file map.\n\n`web` is the HOST DECL surface: the embedder\nregisters it in both lanes (src/mount.rs), so it rides no manifest\npath here — the registration prefix every crossing carries is `web`.",
  "name": "ui",
  "entry": {
    "lib": "./ui.rut",
    "libs": [
      "./store.rut",
      "./widget.rut",
      "./lowering.rut",
      "./diff.rut",
      "./components.rut"
    ]
  },
  "deps": {
    "pouch": {
      "path": "../../../../rut/pouch"
    },
    "nmapset": {
      "path": "../../../../rut/nmapset"
    }
  }
}
