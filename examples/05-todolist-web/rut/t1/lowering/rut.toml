# t1/lowering/ — the LOWERING table's package: Widget -> Lowered, the
# tag/token/utility-ladder map (the whole styling contract, design §5).
# Pure — no state, no crossings — so it LINKS. Its exports are concrete;
# biz never sees this package (components and app import `widget`, and
# the gate holds that line).
name = "lowering"
entry.lib = "./lowering.rut"

[deps]
widget = { path = "../widget" }
