# store/atom/ — the atom CELL layer (restructure survey §4.2): Rail +
# Atom<T> + StrAtom. PURE rut — no web crossings, no clock, no widget:
# the store is standalone (survey §3.3 — the store never touches the
# DOM or the timer).
#
# `inline = true`: the package exports GENERIC types (Atom<T>), and a
# generic export splices by law (graph.rs auto-splices generics even
# without the flag; the flag keeps it explicit — the nmapset/ink/json
# precedent). Splicing keeps Atom<T> type identity same-unit for the
# `todos` domain fields, per-package composition with the graph's
# origin dedup — NOT the retired appkit concatenation.
name = "atom"
entry.lib = "./atom.rut"
inline = true

[deps]
pouch = { path = "../../../../../rut/pouch" }
nmapset = { path = "../../../../../rut/nmapset" }
