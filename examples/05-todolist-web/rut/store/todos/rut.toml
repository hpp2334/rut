# store/todos/ — the "server": the committed list, the request table,
# the booking/answer machine — NOW THE ATOM STORE (restructure survey
# §4): items/reqs/draft/note are atoms (the store's fields), the
# counts line is a derived atom (counts$), the flush is
# `TodoStore.refresh` once per turn before view. PURE rut (no web
# crossings, no clock — the app books the timers), driven DOM-FREE by
# tests/store.rs.
#
# `inline = true`: the package splices into its consumers (the app, the
# two view builders), which keeps Todo/Req/TodoStore type identity and
# method calls same-unit — explicit per-package composition with the
# graph's origin dedup, not the retired appkit concatenation. Its
# fields are typed by `atom`'s generics, so the atom + derived pkgs
# ride the same composition path (survey §3.2).
name = "todos"
entry.lib = "./todos.rut"
inline = true

[deps]
pouch = { path = "../../../../../rut/pouch" }
atom = { path = "../atom" }
derived = { path = "../derived" }
