# store/todos/ — the "server": the committed list, the request table,
# the booking/answer machine. PURE rut (no web crossings, no clock —
# the app books the timers), driven DOM-FREE by tests/store.rs.
#
# THIS PHASE the class is the OLD Store, moved verbatim (survey §6:
# the atom rewrite is phase 2 — one risky thing per phase). The
# package name is the survey's phase-2 slot (`todos`) so phase 2
# changes no manifest and no use path.
#
# `inline = true`: the package splices into its consumers (the app, the
# two view builders), which keeps Todo/Req/Store type identity and
# method calls same-unit — explicit per-package composition with the
# graph's origin dedup, not the retired appkit concatenation.
name = "todos"
entry.lib = "./todos.rut"
inline = true

[deps]
pouch = { path = "../../../../../rut/pouch" }
