# rut/ — THE rut project of 05-todolist-web (RFC 0038 §1: a consumer
# directory with dependencies is a project). The native lane mounts THIS
# directory (`load_dir_session`) — the manifest, not a Rust fn, is the
# module list, and RFC 0045's four passes run for real. The wasm lane
# keeps the `Session` I/O-free and registers the same closure by hand —
# `src/mount.rs` is this file's MIRROR, and the twin gate
# (`tests/mount_lane.rs`) pins the two to the same mounted-name set,
# host surface, and binary.
#
# One directory is one module with ONE entry file (RFC 0035 §1); use
# paths name PACKAGES, never directories — the layout below is
# filesystem organization only. The tree and every package's residents
# are the restructure survey's §3 (docs/todolist-restructure-survey.md,
# the authoritative shape):
#
#   web/          the DOM crossing — a host pkg (entry.type, RFC 0025),
#                 the rut/calc + 03-plugin/server precedent
#   t1/widget     the Widget type, its fluent builders (inherent impls
#                 live in the type's module, RFC 0012 §2) and predicates
#   t1/lowering   the tag/token ladder table — pure Widget -> Lowered
#   t1/core       the framework state machine (T1Root, mount, registry,
#                 keyed diff) — inline: the harness reads its private
#                 tables same-unit, and that is splice composition, not
#                 the retired appkit hack (per-package, deduped)
#   store/atom     the atom CELL layer (survey §4.2): the generation
#                  rail + Atom<T> + the StrAtom lane — inline (generic
#                  exports splice by law)
#   store/derived  the DERIVED layer (survey §4.3/§4.4): the Derived
#                  trait (the declared DAG) + Seen — inline (generic
#                  over the store type)
#   store/todos    the "server": the list, the request table, the
#                 answer machine — THE ATOM STORE (items/reqs/draft/
#                 note as atoms, counts$ the derived, refresh() the
#                 flush) — inline (Todo/TodoStore identity same-unit)
#   components/*  the widget vocabulary, one package per kind (the
#                 one-dir-one-module law: a directory holding N sibling
#                 .rut files is not mountable as N modules, so
#                 per-file means per-package); each imports `widget`
#                 and nothing else of t1
#   app/*         the biz code — the project entry (app) and the two
#                 view builders (todo_list, todo_row; `row` is taken by
#                 the component, so the view pkgs carry unambiguous
#                 names — first-mount-wins would silently skip a
#                 duplicate)
name = "app"
entry.lib = "./app/app/app.rut"

[deps]
web = { path = "web" }
widget = { path = "t1/widget" }
lowering = { path = "t1/lowering" }
t1 = { path = "t1/core" }
atom = { path = "store/atom" }
derived = { path = "store/derived" }
todos = { path = "store/todos" }
col = { path = "components/col" }
row = { path = "components/row" }
text = { path = "components/text" }
button = { path = "components/button" }
checkbox = { path = "components/checkbox" }
field = { path = "components/field" }
spacer = { path = "components/spacer" }
card = { path = "components/card" }
todo_list = { path = "app/todo_list" }
todo_row = { path = "app/todo_row" }
