# app/ — the biz code. This package IS the project entry (the root
# manifest's entry.lib points here); the manifest below is the
# package's own standalone shape, kept in step with the root's [deps]
# (the root mounts the closure; this file documents and enables the
# package's own build). The other two biz packages — todo_list and
# todo_row — are siblings under rut/app/, per the survey's tree.
name = "app"
entry.lib = "./app.rut"

[deps]
web = { path = "../../web" }
widget = { path = "../../t1/widget" }
lowering = { path = "../../t1/lowering" }
t1 = { path = "../../t1/core" }
todos = { path = "../../store/todos" }
col = { path = "../../components/col" }
row = { path = "../../components/row" }
text = { path = "../../components/text" }
button = { path = "../../components/button" }
checkbox = { path = "../../components/checkbox" }
field = { path = "../../components/field" }
spacer = { path = "../../components/spacer" }
card = { path = "../../components/card" }
todo_list = { path = "../todo_list" }
todo_row = { path = "../todo_row" }
