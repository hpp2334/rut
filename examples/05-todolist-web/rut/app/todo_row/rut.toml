# app/todo_row/ — THE ROW (TodoRow): check + title + quiet del, keyed
# `row-<id>` — the diff's identity, so a row SURVIVES every patch
# between commits. Imports the store types, the widget type, and the
# row/checkbox/text/button vocabulary. (The package is `todo_row`, not
# `row`: the component `row` took the short name, and first-mount-wins
# would silently skip a duplicate — survey §3.3.)
name = "todo_row"
entry.lib = "./todo_row.rut"

[deps]
todos = { path = "../../store/todos" }
widget = { path = "../../t1/widget" }
row = { path = "../../components/row" }
checkbox = { path = "../../components/checkbox" }
text = { path = "../../components/text" }
button = { path = "../../components/button" }
