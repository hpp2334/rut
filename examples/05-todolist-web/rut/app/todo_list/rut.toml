# app/todo_list/ — THE LIST (TodoList): one keyed row per committed
# todo (commit order), then a pending line per outstanding add — and
# the §7.3 subject tables, RETURNED to the app beside the `.subject`
# calls they mirror (drop-then-refill per render; a stale subject is a
# LOUD miss). Imports the store, the widget type, the card + text
# vocabulary, and its row builder — plus nmapset, because the tables
# ARE the val-column row `HashMap<str, i64>` (the survey's
# per-package import list abbreviates this one away).
name = "todo_list"
entry.lib = "./todo_list.rut"

[deps]
todos = { path = "../../store/todos" }
widget = { path = "../../t1/widget" }
nmapset = { path = "../../../../../rut/nmapset" }
card = { path = "../../components/card" }
text = { path = "../../components/text" }
todo_row = { path = "../todo_row" }
