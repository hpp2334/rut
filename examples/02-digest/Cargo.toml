[package]
name = "digests"
version = "0.1.0"
edition = "2021"
publish = false
description = "02-digest — a Rust app embedding rut: the rut side is a byte-level library (hex, base64, MD5, SHA-1, SHA-256, SHA-512, CRC-32, FNV-1a, djb2, sdbm, JSON), the Rust side compiles it and verifies every result against the md-5/sha1/sha2/base64/crc32fast/serde_json crates"

[dependencies]
rut-core = { path = "../../crates/rut-core" }
rut-lexer = { path = "../../crates/rut-lexer" }
rut-parser = { path = "../../crates/rut-parser" }
rut-driver = { path = "../../crates/rut-driver" }
rut-vm = { path = "../../crates/rut-vm" }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1"
serde_json = "1"

[[bin]]
name = "digests"
path = "src/main.rs"
