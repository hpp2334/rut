  "_comment": "02-digest — the app is a module dir, like every rut program: the\nmanifest carries the deps, and the embedder (`src/main.rs`,\n`tests/session.rs`) loads this dir through the manifest lane\n(`load_dir_session_with`) — same host half, new mount lane.\n\nTHE CDN ROWS: pouch, json and nmapset ship as COMMITTED v5 compiled\nbundles (dist/std/<pkg>.rutbundle, jsDelivr-served at the tag,\nsha256-pinned here — the pin is law at the mount door on every load).\nAll three are GENERIC owners, and since the generic-source riding law\ntheir bundles carry the source beside the binaries: this consumer\nspells `Vec<opaque>` and drives json's traits + writer directly, and\nthe shapes compile from the bundles at the link. The embedder names\nits remote policy (Loader + HttpRemote::project_local) — a cold start\nnetworks on its misses, a warm start is pure cache; the TESTS prime\nan offline remote from the committed artifacts (dist/std plays the\nwire), so the gates never touch the network. `nmapset` rides because a\nbundle-mounted json's pack-time ledger names its dev closure — the\ncompiled rows reference the peer scopes, so the closure must contain\nthem (the six-pin law); json's optional integration groups mount only\nfor closure members, so the nmapset rows stay inert unless spelled.\njson's own `[deps]` pulls strbuild (the writer's accumulator), so the\nembedder pairs the load with `strbuild::pkg()` — and nmapset's bundle\ncarries `nmap_host`, whose bodies bind beside it (the tests do;\nexactly ink + `logger::pkg`).",
