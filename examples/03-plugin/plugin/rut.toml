# plugin/ — the moderator module (RFC 0035 §1: one directory is one module).
#
# The manifest is bundle-shaped (RFC 0038 §2, layout v2): directory
# loading ignores the format keys, and `rut pack plugin/` needs them —
# so the same directory packs to a `.rutbundle` unchanged, with its
# deps riding the bundle as `<pkg>/` groups.
format = "rutbundle"
format_version = 2
name = "plugin"
entry.lib = "./plugin.rut"

[deps]
server = { path = "../server" }
pouch = { path = "../../../rut/pouch" }
