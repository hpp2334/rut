{
  "_comment": "plugin/ — the moderator module (one directory is one module).\n\nThe manifest is bundle-shaped (layout v5): directory\nloading ignores the format keys, and `rut pack plugin/` needs them —\nso the same directory packs to a v5 compiled `.rutbundle` unchanged,\nwith linkable deps riding as `.rutc` groups and splice-needed deps\n(server's host surface) as source groups.\n\nTHE CDN ROW: `pouch` ships as a COMMITTED v5 compiled bundle\n(dist/std/pouch.rutbundle, jsDelivr-served at the tag, sha256-pinned\nhere — the pin is law at the mount door on every load). pouch is a\nGENERIC owner, and since the generic-source riding law its bundle\ncarries the source beside the binary — the plugin's consumer-spelled\n`Vec<..>` shapes compile from the bundle at the link. The loader is\nthe Loader door with the project-local remote (src/lib.rs); the pack\nlane takes the same remote (src/main.rs). The TESTS prime an offline\nremote from the committed artifacts (dist/std plays the wire), so the\ngates never touch the network — and the pack's\nrode-along law carries the pouch group inside the plugin's own\nbundle, so the packed form stays closed.",
  "format": "rutbundle",
  "format_version": 5,
  "name": "plugin",
  "entry": {
    "lib": "./plugin.rut"
  },
  "deps": {
    "server": {
      "path": "../server"
    },
    "pouch": { "url": "https://cdn.jsdelivr.net/gh/hpp2334/rut@std-v1/dist/std/pouch.rutbundle", "sha256": "2ce488b4b345e137803965d124bc09b2c0aa2b5924bc2b9253e874d2d6da9832" }
  }
}
