[package]
name = "todolist"
version = "0.1.0"
edition = "2021"
publish = false
description = "00-todolist — a Rust app embedding rut: the rut side is a todo-list CRUD library, the Rust side compiles, verifies, and runs it under budgets"

[dependencies]
rut-driver = { path = "../../crates/rut-driver" }
rut-native = { path = "../../crates/rut-native" }
rut-vm = { path = "../../crates/rut-vm" }

[[bin]]
name = "todolist"
path = "src/main.rs"

[dev-dependencies]
# a test's scratch directory — it dies with the test
rut-testkit = { workspace = true }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
