[package]
name = "rut-lsp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm shim exposing the language core over wasm-bindgen — the VS Code extension runs it in-process, no server process"

# wasm-pack's optional wasm-opt pass downloads binaryen from GitHub at
# build time — the lane's optimization already comes from the cargo
# release profile, and CI stays hermetic without it
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "rut_lsp_wasm"
path = "src/lib.rs"
crate-type = ["cdylib"]

# The pure language core only — the stdio face (tower-lsp-server + tokio)
# stays out of the module. The manifest/bundle machinery (`rut_lsp::deps`)
# rides inside rut-lsp, so rut-driver is already in this graph (it added
# the dep in the same change that landed `deps`) — wasm32-clean, proven by
# rut-wasm.
[dependencies]
rut-lsp = { path = "../rut-lsp", default-features = false }
# the entry-source Mode (`Decl`/`Impl`) the envelope spells as a string —
# named directly so the match is explicit, not a Debug-format wire value
rut-parser = { path = "../rut-parser" }
# the `Vis` spell on the mod-decl envelope rows (`pub` / `mod`)
rut-ast = { path = "../rut-ast" }
ls-types = "0.0.6"
serde_json = "1" # user-approved: serializes the ls-types values over the ABI
# the JS boundary: &str / &[u8] in, the JSON envelope String out — the
# glue (pkg/) is generated by wasm-pack --target web at build time
wasm-bindgen = "0.2"

[dev-dependencies]
# the mod-carrying bundle fixture is packed through the same writer the
# CLI uses (wasm32-clean — it rides the main graph already)
rut-driver = { path = "../rut-driver" }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
