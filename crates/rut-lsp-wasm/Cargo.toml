[package]
name = "rut-lsp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the wasm-bindgen face over the rut language core (rut-lsp) — one async RutLsp class; the VS Code extension runs it in-process"

# wasm-pack's optional wasm-opt pass downloads binaryen from GitHub at
# build time — the lane's optimization already comes from the cargo
# release profile, and CI stays hermetic without it
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "rut_lsp_wasm"
path = "src/lib.rs"
# cdylib for wasm-pack; rlib so a native embedder can reach the face
crate-type = ["cdylib", "rlib"]

# The FACE crate: the queries, the actor loop, and the session state
# live in rut-lsp (the core — native-clean AND wasm32-clean); what
# stays here is the wasm boundary only.
[dependencies]
# THE LAYER LAW — this face's ONLY language dep is rut-lsp: the dep
# line is the proof. Every ABI method is a one-line delegation onto
# `rut_lsp::Lsp`; no query, no state, no wire spelling lives here.
rut-lsp = { path = "../rut-lsp" }
# the JS boundary: owned strings/bytes in, the JSON envelope String out
# — the async bridge futures must not borrow, so the entries take
# String/Vec<u8> (the JS-visible call shape is unchanged); the glue
# (pkg/) is generated by wasm-pack --target web at build time
wasm-bindgen = "0.2"
# the injected read-only host environment (`set_env`): the host
# object's read/readDir/isDir/notify functions, cached as plain
# js_sys::Function calls (sync — no JsFuture anywhere) in `JsEnv`,
# the face's `rut_lsp::env::Io` impl
js-sys = "0.3"
# the boot seam: `RutLsp::new` parks the core's loop on the JS
# microtask queue (`Lsp::boot`'s spawn closure)
wasm-bindgen-futures = "0.4"

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
