[package]
name = "rut-lsp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut language core and its wasm ABI — semantic tokens, diagnostics, symbols, hover, completion, definition, deps; the VS Code extension runs it in-process"

# wasm-pack's optional wasm-opt pass downloads binaryen from GitHub at
# build time — the lane's optimization already comes from the cargo
# release profile, and CI stays hermetic without it
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "rut_lsp_wasm"
path = "src/lib.rs"
# cdylib for wasm-pack; rlib so the integration tests (and any native
# embedder) can link the queries directly
crate-type = ["cdylib", "rlib"]

# The queries and the ABI are one crate: the graph is the language
# core's own (the frontend crates + the driver's pure core + ls-types),
# plus wasm-bindgen/serde for the boundary. Native-clean — the tests
# run in the workspace's native nextest lane — and wasm32-clean,
# proven by the CI lane.
[dependencies]
# THE LAYER LAW — this crate's ONLY frontend is rut-semantic (the
# document layer: ParsedDoc, classify, symbols, mode derivation, the
# position math). NO rut-lexer / rut-parser: nobody here drives
# normalize → lex → parse by hand. rut-ast stays as shared tree
# VOCABULARY (hover walks trees); rut-driver carries the manifest/
# bundle bytes; rut-core the checker's run chain.
rut-semantic = { path = "../rut-semantic" }
rut-ast = { path = "../rut-ast" }
rut-core = { path = "../rut-core" }
# the manifest/bundle bridge (`deps`): parse_manifest + the STORE-only
# zip reader live here, and the crate is wasm32-clean (rut-wasm already
# builds it for the shim) — pure bytes in, values out
rut-driver = { path = "../rut-driver" }
# LSP values — the same crate tower-lsp-server re-exports; the queries
# produce them whole and `wire` serializes them for the ABI
ls-types = "0.0.6"
# the url-dep cache filename (`.rut/cache/<sha256(url)>.rutbundle`) is
# computed Rust-side — JS never hashes URLs; pure Rust, wasm-clean
sha2 = "0.10"
serde = { version = "1", features = ["derive"] } # user-approved: the `wire` structs derive Serialize (serde_json's own backend; no runtime beyond the derive)
serde_json = "1" # user-approved: serializes the ls-types values over the ABI
# the JS boundary: owned strings/bytes in, the JSON envelope String out
# — the async bridge futures must not borrow, so the entries take
# String/Vec<u8> (the JS-visible call shape is unchanged); the glue
# (pkg/) is generated by wasm-pack --target web at build time
wasm-bindgen = "0.2"
# the injected read-only host environment (`set_env`): the host
# object's read/readDir/isDir/notify functions, cached as plain
# js_sys::Function calls (sync — no JsFuture anywhere). Native-clean:
# the types compile everywhere, only the wasm ever calls them
js-sys = "0.3"
# the actor seam: the event loop's mpsc inbox + oneshot replies ride
# the channels (std — the mpsc lives behind it; the wasm target ships
# std anyway). The std EXECUTOR stays out of the shipped wasm: the loop
# parks on the JS microtask queue through wasm-bindgen-futures
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }
wasm-bindgen-futures = "0.4"

# the native ABI harness's LocalPool (`RutLsp::spawn_native`) — native
# targets only; the wasm never references the executor
[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures = { version = "0.3", features = ["executor"] }

[dev-dependencies]
# the TEST seam: the grammar/corpus tests drive the parser directly —
# production code never may (the [dependencies] block above is the law;
# this block is the sanctioned exception, like the futures LocalPool)
rut-parser = { path = "../rut-parser" }
rut-lexer = { path = "../rut-lexer" }
# the mod-carrying bundle fixture is packed through the same writer the
# CLI uses (wasm32-clean — it rides the main graph already)
rut-driver = { path = "../rut-driver" }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
