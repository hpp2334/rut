[package]
name = "rut-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "host-side runtime helpers — implementations of native-module functions that embedders install"

[lib]
name = "rut_std"
path = "src/lib.rs"

[dependencies]
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
# the borrowed-probe table (nmapset-borrow-probe, docs survey §3): the
# runtime's first external dep — already in the workspace lock (the LSP
# chain), wasm-clean; provides `HashTable::{find, entry, find_entry}`
# over a hand-rolled hash so probes never materialize a key. NO default
# features: ahash/allocator-api2 are for the default hasher, which this
# table never uses (the lane hands the hash word in); inline-more is
# the pure inlining hint.
hashbrown = { version = "0.14.5", default-features = false, features = ["inline-more"] }
# the reqwest transport of the std HTTP lane's reqwest DOOR (`pkg`):
# DEFAULT-OFF is load-bearing — reqwest-blocking does not build on
# wasm32-unknown-unknown, so rut-driver and rut-wasm dep this crate
# WITHOUT the feature and the wasm checks stay clean. rut-cli
# (native-only) opts in with `features = ["http"]`. The `http` MODULE
# itself is feature-free — the swappable-backend seam (`HttpBackend`/
# `pkg_over`/`HttpResponse::streaming`) rides no reqwest, so a wasm
# embedder brings its own backend.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
    "brotli",
], optional = true }

# the fetch transport of the std HTTP lane's wasm DOOR (`pkg_fetch`):
# TARGET-gated to wasm32 so the native graphs never see the JS trio,
# and DEFAULT-OFF behind `http-wasm` (the same law the reqwest lane
# runs — a wasm embedder opts in; everyone else compiles none of it).
# rut-wasm turns the feature on: its playground engine ships the
# fetch lane.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "Window",
] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
http = ["dep:reqwest"]
http-wasm = [
    "dep:wasm-bindgen",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
]

[dev-dependencies]
# the decl↔body contract tests: mount `rut/http_host`,
# compile a probe, `verify_against` — dev-deps never propagate
rut-driver = { path = "../rut-driver" }
rut-native = { path = "../rut-native" }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
