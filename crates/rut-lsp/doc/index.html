<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rut-lsp — the language server, explained</title>
<meta name="description" content="How the rut language server works: the pipeline, the queries, and completion — interactive, with examples.">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-brand-50: #fbf4f2;
    --color-brand-100: #f8e7e2;
    --color-brand-200: #f0cec6;
    --color-brand-400: #d07064;
    --color-brand-500: #bf4b3f;
    --color-brand-600: #b1352c;
    --color-brand-700: #93291f;
    --shadow-card: 0 1px 2px rgba(23,32,58,.05), 0 8px 24px -12px rgba(23,32,58,.18);
    --animate-dot-pulse: dotPulse 1.6s ease-in-out infinite;
    --animate-fade-up: fadeUp .25s ease;
    @keyframes dotPulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
  }
</style>
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  /* code tokens (produced by the JS highlighter — kept as plain CSS) */
  .tk-kw{color:#82aaff}.tk-str{color:#e5b37c}.tk-com{color:#5d6d8f;font-style:italic}
  .tk-num{color:#c792ea}.tk-typ{color:#6fdcbe}.tk-pun{color:#7f8db0}.tk-id{color:#d9e2f5}
  /* the completion-kind chip base (colors ride Tailwind per kind) */
  .kind{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;
        font-size:.68rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  pre::-webkit-scrollbar{height:8px}
  pre::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:4px}
</style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 antialiased">
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
