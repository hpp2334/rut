[package]
name = "rut-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut language core behind every editor face — semantic tokens, diagnostics, document symbols, hover, completion, definition, check"

# The pure core: no transport, no tokio, no LSP service. The two shells
# that serve it are separate crates — `rut-lsp-server` (stdio, the native
# `rut-lsp` binary) and `rut-lsp-wasm` (the in-process module the VS Code
# extension and the playground bundle). Both call the same `analysis`
# entry points, so they cannot drift; keeping the service out of here is
# what lets the wasm lane stay wasm32-clean with no feature gymnastics.
[lib]
name = "rut_lsp"
path = "src/lib.rs"

# The workspace's first external dependencies (user-approved). Note: the
# `tower-lsp` crate is stale; `tower-lsp-server` is its maintained
# continuation (tower-lsp-community) — same API lineage. `ls-types` is
# that crate's renamed lsp-types; a direct dep so the pure modules and
# the server share one set of LSP values (the same version tower-lsp-server
# re-exports). serde_json (user-approved) serializes them for the wasm ABI.
[dependencies]
ls-types = "0.0.6"
rut-core = { path = "../rut-core" }
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
rut-parser = { path = "../rut-parser" }
rut-semantic = { path = "../rut-semantic" }
# the manifest/bundle bridge (`deps`): parse_manifest + the STORE-only
# zip reader live here, and the crate is wasm32-clean (rut-wasm already
# builds it for the shim) — pure bytes in, values out
rut-driver = { path = "../rut-driver" }
# the url-dep cache filename (`.rut/cache/<sha256(url)>.rutbundle`) is
# computed Rust-side — JS never hashes URLs; pure Rust, wasm-clean
sha2 = "0.10"

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
