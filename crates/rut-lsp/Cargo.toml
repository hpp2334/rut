[package]
name = "rut-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut language server — semantic tokens, diagnostics, document symbols (the M6 LSP slice, landed early; RFC 0041 §2)"

[lib]
name = "rut_lsp"
path = "src/lib.rs"

[[bin]]
name = "rut-lsp"
path = "src/main.rs"

# The workspace's first external dependencies (user-approved). Note: the
# `tower-lsp` crate is stale; `tower-lsp-server` is its maintained
# continuation (tower-lsp-community) — same API lineage.
[dependencies]
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "time"] }
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
rut-parser = { path = "../rut-parser" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
