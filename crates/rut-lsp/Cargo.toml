[package]
name = "rut-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut language core for language servers — the queries, the actor event loop, and the session state behind the editor ABI (the wasm-bindgen face lives in rut-lsp-wasm)"

[lib]
name = "rut_lsp"
path = "src/lib.rs"
# rlib — the wasm face, the tests, and any native embedder link the
# queries directly (a cdylib face would be the wasm crate's business)

# The language core: the graph is the frontend crates + the driver's
# pure core + ls-types, plus serde for the envelope wire. Native-clean
# — the tests run in the workspace's native nextest lane — and
# wasm32-clean, proven by the face's CI lane.
[dependencies]
# THE LAYER LAW — the frontend lives INSIDE this crate: the sealed
# `semantic` module (Document — parse + its read/join doors, mode
# derivation, the position math) is the crate's ONLY consumer of the
# grammar, so `rut-lexer`/`rut-ast` are its vocabulary and nothing
# else here drives normalize → lex → parse by hand (production src
# spells the parser lane only inside semantic/doc.rs; the corpus tests
# pin the same grammar through the public door, tests/corpus.rs).
# rut-driver carries the manifest/bundle bytes; rut-core the checker's
# run chain.
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
rut-core = { path = "../rut-core" }
# the manifest/bundle bridge (`deps`): parse_manifest + the STORE-only
# zip reader live here, and the crate is wasm32-clean (rut-wasm already
# builds it for the shim) — pure bytes in, values out
rut-driver = { path = "../rut-driver" }
# LSP values — the same crate tower-lsp-server re-exports; the queries
# produce them whole and `wire` serializes them for the ABI
ls-types = "0.0.6"
# the url-dep cache filename (`.rut/cache/<sha256(url)>.rutbundle`) is
# computed Rust-side — JS never hashes URLs; pure Rust, wasm-clean
sha2 = "0.10"
serde = { version = "1", features = ["derive"] } # user-approved: the `wire` structs derive Serialize (serde_json's own backend; no runtime beyond the derive)
serde_json = "1" # user-approved: serializes the ls-types values over the ABI
# the actor seam: the event loop's mpsc inbox + oneshot replies ride
# the channels (std — the mpsc lives behind it; the wasm target ships
# std anyway). No executor is picked here: the loop's parking is the
# host's choice (`Lsp::boot`'s spawn seam — the wasm face hands
# `spawn_local`, native tests a LocalPool)
futures = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] }

# `Lsp::spawn_native`'s LocalPool — native targets only; the wasm never
# references the executor
[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures = { version = "0.3", features = ["executor"] }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
