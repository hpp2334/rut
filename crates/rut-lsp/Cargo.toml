[package]
name = "rut-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut language server — semantic tokens, diagnostics, document symbols (the M6 LSP slice, landed early; RFC 0041 §2)"

[lib]
name = "rut_lsp"
path = "src/lib.rs"

[[bin]]
name = "rut-lsp"
path = "src/main.rs"

[features]
default = ["server"]
# the stdio JSON-RPC face (tower-lsp-server + tokio) — native only. The
# wasm shim (`rut-lsp-wasm`, the VS Code extension) builds this crate with
# `default-features = false` and gets the pure core alone.
server = ["dep:tower-lsp-server", "dep:tokio"]

# The workspace's first external dependencies (user-approved). Note: the
# `tower-lsp` crate is stale; `tower-lsp-server` is its maintained
# continuation (tower-lsp-community) — same API lineage. `ls-types` is
# that crate's renamed lsp-types; a direct dep so the pure modules and
# the server share one set of LSP values (the same version tower-lsp-server
# re-exports). serde_json (user-approved) serializes them for the wasm ABI.
[dependencies]
ls-types = "0.0.6"
tower-lsp-server = { version = "0.23", optional = true }
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "time"], optional = true }
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
rut-parser = { path = "../rut-parser" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
