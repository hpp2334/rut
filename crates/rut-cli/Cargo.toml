[package]
name = "rut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the `rut` binary — run / dump"

[[bin]]
name = "rut"
path = "src/main.rs"

[dependencies]
rut-driver = { path = "../rut-driver" }
rut-bundle = { path = "../rut-bundle" }
rut-fmt = { path = "../rut-fmt" }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
# native-only binary: the std HTTP lane rides here (the wasm graphs
# dep rut-std WITHOUT the feature — reqwest-blocking does not build on
# wasm32-unknown-unknown)
rut-std = { path = "../rut-std", features = ["http"] }
rut-lexer = { path = "../rut-lexer" }
rut-parser = { path = "../rut-parser" }
# the url-dep lane's transport: the same reqwest pin as rut-std's HTTP
# lane MINUS `blocking` (the CLI block_on's one tokio thread instead),
# so the lock keeps ONE reqwest entry. Cache-first: a hit never
# touches the network.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
] }
