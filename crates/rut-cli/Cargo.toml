[package]
name = "rut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the `rut` binary — run / pack / install"

[[bin]]
name = "rut"
path = "src/main.rs"

[dependencies]
# the arg surface: derive-based clap — the one third-party dep (the
# hand-rolled door served fine at 3 flags, but -h/--help and honest
# parse errors earn it)
clap = { version = "4.5", features = ["derive"] }
# the per-project install lock's primitive: flock on Unix, LockFileEx
# on Windows — a kernel-owned advisory lock the OS releases when the
# holder dies (no stale-lock cleanup code)
fd-lock = "4"
rut-driver = { path = "../rut-driver" }
# the walk + the remotes + the pack lanes (the native host half)
rut-native = { path = "../rut-native" }
rut-fmt = { path = "../rut-fmt" }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
# native-only binary: the std HTTP lane rides here (the wasm graphs
# dep rut-std WITHOUT the feature — reqwest-blocking does not build on
# wasm32-unknown-unknown)
rut-std = { path = "../rut-std", features = ["http"] }
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
# the url-dep lane's transport lives in rut-native (`HttpRemote`,
# behind its default-on `http` feature — the lock keeps ONE reqwest
# entry); the CLI points run/pack's url reads at the global dep store
# (`RUT_HOME`, default `~/.rut` — rut-driver's derivation core) and
# block_on's the READY fetch futures with a noop waker.

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
