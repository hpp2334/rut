[package]
name = "rut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the `rut` binary — run / pack / fetch"

[[bin]]
name = "rut"
path = "src/main.rs"

[dependencies]
rut-driver = { path = "../rut-driver" }
rut-fmt = { path = "../rut-fmt" }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
# native-only binary: the std HTTP lane rides here (the wasm graphs
# dep rut-std WITHOUT the feature — reqwest-blocking does not build on
# wasm32-unknown-unknown)
rut-std = { path = "../rut-std", features = ["http"] }
rut-lexer = { path = "../rut-lexer" }
rut-parser = { path = "../rut-parser" }
rut-ast = { path = "../rut-ast" }
# the url-dep lane's transport lives in rut-driver now (`HttpRemote`,
# behind its default-on `http` feature — the lock keeps ONE reqwest
# entry); the CLI names the cache root (`RUT_CACHE_DIR` override /
# project-local) and block_on's the READY fetch futures with a noop
# waker.
