[package]
name = "rut-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the rut AST — typed-arena tree + its grammar (one crate: structure, parser)"

[lib]
name = "rut_ast"
path = "src/lib.rs"

[dependencies]
rut-lexer = { path = "../rut-lexer" }
rut-core = { path = "../rut-core" }
# the lazy TreeIndex cell — cold parses build the index on first read;
# sync plain data, so `Ast` stays Send + Sync
once_cell = "1"

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
