# T3: BOTH peers present — both groups mount (peer-name BTreeMap
# order, after the base) and both impl sets dispatch.
# The bundle keys are T12's: this same world packs and loads as a v3
# bundle with BOTH groups riding the archive (directory loads ignore
# the format keys, RFC 0038 §2).
format = "rutbundle"
format_version = 3
name = "cons_both"
entry.lib = "./cons.rut"

[deps]
json    = { path = "../json" }
nmapset = { path = "../nmapset" }
pouch   = { path = "../pouch" }
