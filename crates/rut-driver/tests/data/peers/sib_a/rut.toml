# sib_a — T10's first sibling (RFC 0045 fixtures): a concrete class over
# pouch's generic Vec. `inline = true` makes it an inline unit (the
# splice path), so a consumer importing it splices pouch transitively —
# the shape that, undeduped, collides with any OTHER pouch-riding use.
name = "sib_a"
entry.lib = "./sib_a.rut"
inline = true

[deps]
pouch = { path = "../pouch" }
