[package]
name = "rut-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the pipeline driver — compile_module: parse → check/LIR → binary; the CLI and wasm entry point"

[lib]
name = "rut_driver"
path = "src/lib.rs"

[dependencies]
rut-core = { path = "../rut-core" }
rut-lexer = { path = "../rut-lexer" }
rut-ast = { path = "../rut-ast" }
rut-parser = { path = "../rut-parser" }
rut-lir = { path = "../rut-lir" }
rut-vm = { path = "../rut-vm" }
# the `.rutbundle` container — a module of this crate (`bundle/`), not a
# separate crate: serde_json parses the manifest grammar, zip carries the
# deterministic archive subset
serde_json = "1" # user-approved: the manifest's JSON syntax lane (no features)
zip = { workspace = true }
thiserror = { workspace = true }
# the pin law's arithmetic: the sha256 pin is manifest law, verified at
# the mount door on EVERY load — so the dependency is unconditional and
# wasm-clean (pure Rust; no features, no I/O). The url-dep lane's
# transport lives in rut-native (`HttpRemote`, behind ITS default-on
# `http` feature — the lock keeps ONE reqwest entry).
sha2 = "0.10"

[dev-dependencies]
# the walk moved out — its gates load real directories through it
rut-native = { path = "../rut-native" }
rut-std = { path = "../rut-std" }
