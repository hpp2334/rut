[package]
name = "rut-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm shim exposing compile/run over wasm-bindgen — the playground + book engine class"

# wasm-pack's optional wasm-opt pass downloads binaryen from GitHub at
# build time — the lane's optimization already comes from the cargo
# release profile, and CI stays hermetic without it
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "rut_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# the JS boundary: &str / &[u8] in, the JSON envelope String out — the
# glue (pkg/) is generated by wasm-pack at build time (web target for
# the demo + smoke, no-modules for the book's classic-script page)
wasm-bindgen = "0.2"
# the driver is pure (no wire, no fs — its old `http` feature moved to
# rut-native); this graph loads url-free projects and bundles only, so
# it never needs a remote
rut-driver = { path = "../rut-driver" }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
rut-std = { path = "../rut-std" }
rut-parser = { path = "../rut-parser" }
rut-ast = { path = "../rut-ast" }
rut-lexer = { path = "../rut-lexer" }

[dev-dependencies]
# HOST-ONLY (cargo test never builds for wasm32): the pack lane that
# builds the test bundle and the tree-pkg offer
rut-native = { path = "../rut-native" }

# opt into the workspace lint gate (warnings = deny)
[lints]
workspace = true
