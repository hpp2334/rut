[package]
name = "rut-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm shim exposing compile/run over a raw ABI (RFC 0041 §3) — no wasm-bindgen, plain exports"

[lib]
name = "rut_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rut-driver = { path = "../rut-driver" }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
rut-std = { path = "../rut-std" }
rut-parser = { path = "../rut-parser" }
