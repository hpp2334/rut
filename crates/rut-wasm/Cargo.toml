[package]
name = "rut-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm shim exposing compile/run over a raw ABI — no wasm-bindgen, plain exports"

[lib]
name = "rut_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false: the `http` wire (reqwest + tokio) does not
# build on wasm32-unknown-unknown — this graph loads url-free projects
# and bundles only, so it never needs a remote
rut-driver = { path = "../rut-driver", default-features = false }
rut-core = { path = "../rut-core" }
rut-vm = { path = "../rut-vm" }
rut-std = { path = "../rut-std" }
rut-parser = { path = "../rut-parser" }
rut-ast = { path = "../rut-ast" }
rut-lexer = { path = "../rut-lexer" }
