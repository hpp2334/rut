# nmapset-int/ — the HOST-backed twin of the removed `hashmap-int`
# mapset row: the identical
# i32 churn over `nmapset::HashMap` (the native-key experiment pkg, the
# mapset-host plan) instead of the removed pure-rut `mapset`. A module
# dir (not a
# loose file) because it mounts `nmapset`, which pulls the `nmap` host
# pkg through its own `[deps]`; the CLI registers `install_std_nmap`
# alongside math/logger. `ink` is declared for the logger. The
# checksum must equal the pinned 734932704 (same hash values — the
# nmapset pkg ships the mapset-exact mix64 constants).
name = "nmapset_int"
entry.lib = "./main.rut"

[deps]
nmapset = { path = "../../../rut/nmapset" }
ink = { path = "../../../rut/ink" }
