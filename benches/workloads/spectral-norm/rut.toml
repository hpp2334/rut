# spectral-norm/ — the benchmark-game power-iteration norm (n = 150,
# 10 iterations), with the same fixed-iteration Newton sqrt as the JS
# twin so the checksum is exact. A module dir because it mounts `pouch`;
# `ink` is declared for the logger. The JS twin is ../spectral-norm.js.
name = "spectral_norm"
entry.lib = "./main.rut"

[deps]
pouch = { path = "../../../rut/pouch" }
ink = { path = "../../../rut/ink" }
