# nmapset-str/ — the HOST-backed twin of `hashmap-str`: the identical
# str-keyed churn over `nmapset::HashMap` (the native-key experiment
# pkg) instead of pure-rut `mapset`. Module dir because it mounts
# `nmapset` (which pulls the `nmap` host pkg); see
# nmapset-int/rut.toml. The checksum must EQUAL `hashmap-str`'s (same
# FNV-1a values — the nmapset pkg ships mapset's exact constants).
name = "nmapset_str"
entry.lib = "./main.rut"

[deps]
nmapset = { path = "../../../rut/nmapset" }
ink = { path = "../../../rut/ink" }
