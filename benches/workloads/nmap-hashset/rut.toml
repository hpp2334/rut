# nmap-hashset/ — the HOST-backed twin of the removed `hashset` mapset
# row: the identical
# HashSet<i32> churn over `nmapset::HashSet` (the native-key experiment
# pkg) instead of the removed pure-rut `mapset`. Module dir because it
# mounts
# `nmapset` (which pulls the `nmap_host` host pkg); see
# nmapset-int/rut.toml. The checksum must equal the pinned 21500055
# (same hash values — the nmapset pkg ships the mapset-exact mix64
# constants).
name = "nmap_hashset"
entry.lib = "./main.rut"

[deps]
nmapset = { path = "../../../rut/nmapset" }
ink = { path = "../../../rut/ink" }
