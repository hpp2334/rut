# nmap-knucleotide/ — the HOST-backed twin of the removed `knucleotide`
# mapset row: the
# identical k-mer counting over `nmapset::HashMap<str, i32>` (the
# native-key experiment pkg) instead of the removed pure-rut `mapset`.
# Module dir
# because it mounts `nmapset` (which pulls the `nmap_host` host pkg); see
# nmapset-int/rut.toml. The checksum must equal the pinned 2198604
# (same FNV-1a values — the nmapset pkg ships the mapset-exact
# constants).
name = "nmap_knucleotide"
entry.lib = "./main.rut"

[deps]
nmapset = { path = "../../../rut/nmapset" }
ink = { path = "../../../rut/ink" }
