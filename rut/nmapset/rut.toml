{
  "_comment": "nmapset/ — the native-key map/set EXPERIMENT (the mapset-host plan):\ngeneric wrapper classes over the `nmap_host` host table. The native side\nowns keys (and — since round3 — prim vals); reference values stay\nrut-side (the `[?V]` parallel array), so the `get -> ?V` aliasing\nsemantics are the law. Publishes COMPILED (the linkable-classes\nphase): the generic classes' methods cross on the surface's inherent\nrows, and a consumer instantiates + requests the bodies from this pkg\n(owner-anchored generics).\n\nThe key contract is a COMPILE-TIME union bound now (`K requires\ni8 | i16 | i32 | i64 | u8 | u16 | u32 | u64 | bool | str | bytes`):\nkeys cross DIRECTLY on the typed lanes (no Opaque mint), the\nhost hashes with the pinned mix64/FNV constants — originally\nmapset's, ported bit-for-bit, so the bench pins `734932704` /\n`1264308351` / `21500055` / `2198604` are the old mapset rows'\nvalues. The pure-rut `mapset` pkg itself left the tree in Sep 2026\n(stdlib slim-down — a user-defined key escape-hatches to a `bytes`\nencoding, or vendors the old source from git history; the historical\n`[deps] mapset` splice-collision note lives in nmapset.rut's header).",
  "format": "rutbundle",
  "format_version": 5,
  "name": "nmapset",
  "entry": {
