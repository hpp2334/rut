# async_engine/ — the async host surface's engine rows: the
# crossing signature set the standard launcher needs. The embedding Rust
# builds the bodies (`rut_std::async_host::pkg()`); the
# `async_host` package wraps them in the typed surface
# (`launch_future` / `LaunchedFutureHandle::abort` / `sleep`).
#
# The registration scope IS the package name; the use path spells it
# too (`use async_engine::{ __launch, __abort, __sleep }`).
format = "rutbundle"
format_version = 6
name = "async_engine"
type = "host"
entry.type = "./engine.d.rut"
