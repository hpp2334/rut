# strbuild — the 10th std pkg (the strbuild batch, phase 1;
# docs/strbuild-survey.md is the contract). A pure-rut face over the
# engine's `StrBuf` builtin class: zero host fns, zero deps — the cell
# is AMBIENT (RFC 0028 revised, builtin-surface), so this pkg compiles
# against `mount_std_core` alone, exactly as json needs no host-fn dep.
# No [peer-deps], no [dev-deps] — nothing to integrate with; pkg tests
# ride the driver's program tests, json-style.
#
# Publishes COMPILED (the linkable-classes phase): StringBuilder's
# methods cross on the surface's inherent rows, so `b.append(...)`
# binds in every consumer from this pkg's binary — the ordinary call
# boundary, no source ever crossing.
name = "strbuild"
entry.lib = "./strbuild.rut"
