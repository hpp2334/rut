{
  "_comment": "strbuild — the 10th std pkg: the growable string builder, a rut\nclass over the `strbuild_host` decl pkg's host fns (the ink/Logger\npattern; the bodies live in `rut-std`). One field, one forwarded\nhost call per member — no copy, no re-buffering, the share law rides\nthe host box.\n\n`[deps] strbuild_host` below is the edge: a strbuild mount pulls the\ndecl pkg, whose rows register under the pkg-name scope —\nmounting strbuild adds those declared rows, so an\nembedder pairs the mount with `strbuild::pkg()` (exactly ink +\n`logger::pkg`).\n\nPublishes COMPILED (the linkable-classes phase): StringBuilder's\nmethods cross on the surface's inherent rows, so `b.append(...)`\nbinds in every consumer from this pkg's binary — the ordinary call\nboundary, no source ever crossing.",
  "format": "rutbundle",
  "format_version": 5,
  "name": "strbuild",
  "entry": {
    "lib": "./strbuild.rut"
  },
  "deps": {
    "strbuild_host": {
      "path": "../strbuild_host"
    }
  }
}
