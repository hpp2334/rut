{
  "_comment": "async_host/ — the standard launcher surface, in rut: the\ntyped half of the embedder's async set. Publishes COMPILED (the\nlinkable-classes phase): the generic `launch_future<T>` and the\ngeneric handle class link like any other export — a consumer\ninstantiates and requests the bodies from this pkg (owner-anchored\ngenerics), and `LaunchedFutureHandle::abort` crosses on the surface's\ninherent rows.\n\nThe laws the types encode:\n`Future<T>` — cold, yours to hold: await it or launch it (launch\nconsumes like await consumes; nothing frees you from one).\n`LaunchedFutureHandle<T>` — the receipt: NOT a Future (await\ndiagnoses), not re-launchable (the argument type mismatches —\nruling 6's compile-time law), one member: `abort`.",
  "format": "rutbundle",
  "format_version": 5,
  "name": "async_host",
  "entry": {
    "lib": "./async_host.rut"
  },
  "deps": {
    "async_engine": {
      "path": "../async_engine"
    }
  }
}
