name = "pouch"
entry.lib = "./pouch.rut"
# `inline = true` — Vec's methods are inherent impl members, which cross
# no surface yet: consumers splice the pkg's source and monomorphize at
# their own sites. Instantiation is owner-anchored now (the declaring pkg
# owns every `Vec<i64>` row; mirrors unify at link), and this flag is the
# only splice trigger left — it retires when class methods ride the
# surface and pouch publishes compiled.
inline = true
