[book]
title = "The rut Book"
authors = ["hpp2334"]
description = "rut — a small, statically typed, embeddable scripting language with a Rust-flavored surface, reified types, and a no-JIT bytecode VM"
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/hpp2334/rut"
edit-url-template = "https://github.com/hpp2334/rut/edit/master/docs/{path}"
# rut code coloring (integrations/rut-highlightjs). theme/rut-highlight.js
# is a byte-copy of the integration's generated register.js (its single
# source of truth is src/grammar.js): regen with
#   cd integrations/rut-highlightjs && node scripts/build.mjs
#   cp register.js ../../docs/theme/rut-highlight.js
# mdbook 0.5 does NOT copy cross-tree additional-js into the build (the
# tag would 404 once deployed), hence the committed shim; the token
# palette reads well in both the ayu (default) and light themes.
# rut-book.js (the ▶ Run buttons) runs AFTER the highlighter: it reads
# block textContent, which spans don't disturb. lang-toggle.js is the
# EN | 中文 switch shared with the zh edition (docs/book.zh.toml).
additional-css = ["theme/rut-book.css"]
additional-js = ["theme/rut-highlight.js", "theme/rut-book.js", "theme/lang-toggle.js"]

# The run-button artifact (wasm/rut.wasm at the book root) is NOT wired
# here: mdbook 0.5 dropped `output.html.additional-resources` (the build
# refuses the key — verified), so the deploy lane copies it post-build.
# docs/wasm/ is gitignored build output; `node scripts/deploy.cjs --book`
# builds crates/rut-wasm and copies it into both docs/wasm/ and the
# rendered book/ before the sanity check.

[output.html.search]
enable = true
