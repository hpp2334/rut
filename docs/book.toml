[book]
title = "The rut Book"
authors = ["hpp2334"]
description = "rut — a small, statically typed, embeddable scripting language with a Rust-flavored surface, reified types, and a no-JIT bytecode VM"
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/hpp2334/rut"
edit-url-template = "https://github.com/hpp2334/rut/edit/master/docs/{path}"
# rut code coloring (integrations/rut-highlightjs). theme/rut-highlight.js
# is a byte-copy of the integration's generated register.js (its single
# source of truth is src/grammar.js): regen with
#   cd integrations/rut-highlightjs && node scripts/build.mjs
#   cp register.js ../../docs/theme/rut-highlight.js
# mdbook 0.5 does NOT copy cross-tree additional-js into the build (the
# tag would 404 once deployed), hence the committed shim; the token
# palette reads well in both the ayu (default) and light themes.
additional-css = ["theme/rut-book.css"]
additional-js = ["theme/rut-highlight.js"]

[output.html.search]
enable = true
