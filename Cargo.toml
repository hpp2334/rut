[workspace]
resolver = "2"
members = [
    "crates/rut-core",
    "crates/rut-vm",
    "crates/rut-vm-threaded",
    "crates/rut-std",
    "crates/rut-lexer",
    "crates/rut-ast",
    "crates/rut-parser",
    "crates/rut-lir",
    "crates/rut-driver",
    "crates/rut-fmt",
    "crates/rut-wasm",
    "crates/rut-lsp-wasm",
    "crates/rut-cli",
    "crates/rut-lsp",
    "examples/00-todolist",
    "examples/01-sort",
    "examples/02-digest",
    "examples/03-plugin",
    "examples/05-todolist-web",
    "examples/06-github-viewer-cli",
    "benches/probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zip = { version = "8", default-features = false }
# the error idiom crate-wide (build-time proc-macro, zero runtime
# footprint — wasm unaffected); the driver's errors derive it
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
